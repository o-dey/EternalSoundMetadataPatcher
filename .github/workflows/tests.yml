name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  tests:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      
    - name: Setup nuget
      uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

    - name: Restore packages
      run: nuget restore "EternalSoundMetadataPatcher.sln"

    - name: Build tests
      run: msbuild "EternalSoundMetadataPatcher.Test\EternalSoundMetadataPatcher.Test.csproj" -t:rebuild -verbosity:diag -property:Configuration=Release
    
    - name: Run tests
      run: dotnet test -v n "EternalSoundMetadataPatcher.Test\bin\Release\EternalSoundMetadataPatcher.Test.dll"
    
    - name: Build app
      run: msbuild "EternalSoundMetadataPatcher\EternalSoundMetadataPatcher.csproj" -t:rebuild -verbosity:diag -property:Configuration=Release
